name: Release

# Push a version tag to publish a release:
#   git tag v2.0.0 && git push origin v2.0.0
# The tag must match __version__ in iotift2/__init__.py.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v2.0.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest
      - run: python -m pytest -q
      - name: Check the tag matches the package version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(python -c "import iotift2; print(iotift2.__version__)")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match iotift2.__version__ ($VERSION). Update iotift2/__init__.py or retag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *a*|*b*|*rc*|*dev*) echo "prerelease=true" >> "$GITHUB_OUTPUT";;
                             *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Iotift ${{ needs.build.outputs.tag }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Install

            **Windows** (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            **macOS / Linux**:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **With pip** (Python 3.8+): download the `.whl` below and run `pip install iotift2-*.whl`.

            PlatformIO is installed automatically the first time you run `iotift upload` (or `iotift setup`).
          files: |
            dist/*
            install.ps1
            install.sh

  # Optional: publish to PyPI. Set the repository variable PYPI_PUBLISH to `true` and add this
  # repository as a trusted publisher for the `iotift2` project on pypi.org.
  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
